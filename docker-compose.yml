services:
  monitor:
    build: .
    restart: unless-stopped
    environment:
      # Optional one-time migration path for releases that used .env.
      HCLOUD_TOKEN: "${HCLOUD_TOKEN:-}"
    ports:
      - "8080:8080"
    volumes:
      - monitor-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  monitor-data:
